<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>椿卷 的个人主页</title>
  <!-- 标签页头像 -->
  <link rel="icon" href="https://icloud.komnri.top/nezha/IMG_0234.JPG" type="image/jpeg">
  <link rel="shortcut icon" href="https://icloud.komnri.top/nezha/IMG_0234.JPG" type="image/jpeg">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(to right, #fdfbfb, #ebedee);
      color: #333;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 45px;
      border-radius: 22px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.07);
      max-width: 520px;
      width: 100%;
      text-align: center;
    }
    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin: 0 auto 20px;
      overflow: hidden;
    }
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    h1 {
      font-size: 32px;
      margin-bottom: 12px;
      color: #222;
    }
    .bio {
      color: #666;
      margin-bottom: 32px;
      line-height: 1.6;
      font-size: 16px;
    }
    .links a {
      display: inline-block;
      padding: 11px 20px;
      margin: 6px;
      background: #b492c4;
      color: white;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.25s ease;
    }
    .links a:hover {
      background: #a07cb3;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">
      <img src="https://icloud.komnri.top/nezha/IMG_0234.JPG" alt="头像">
    </div>
    <h1>椿卷</h1>
    <p class="bio">欢迎来到我的小世界<br>简单、安静、自在</p>
    <div class="links">
      <a href="https://github.com/">GitHub</a>
      <a href="#">项目</a>
      <a href="#">关于我</a>
    </div>
  </div>
</body>
</html>
